name: Evidence for #190 (scratch, not for merge)

on:
  push:
    branches: [scratch/187-evidence]

permissions: {}

env:
  PR_HEAD: 7d815229753bb8c10f3fb60959413ef8f3d79edc
  BASE: 0f2d4e6a38dff48821335fce59dff7e6ad744a44

jobs:
  evidence:
    name: build + verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build inputs equal the PR head
        run: |
          git diff --name-only "$PR_HEAD" HEAD
          [[ "$(git diff --name-only "$PR_HEAD" HEAD)" == ".github/workflows/evidence-187.yml" ]]
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq zstd python3-yaml
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Seed printing base
        run: ARCH=${{ matrix.arch }} ci/seed-printing-base.sh
      - name: Build image (PR head)
        run: just bst --config /src/ci/buildstream.conf --network-retries 5 build oci/ghostscript-printer-app.bst
      - name: Dump OCI element build log
        if: failure()
        run: sudo find ~/.cache/buildstream/logs -path '*oci-ghostscript-printer-app*' -name '*build*.log' -exec grep -n 'slim-printing\|rm:\|install:' {} + || true
      - name: Build and verify FSDK appliance (PR head)
        run: just verify
      - name: Compressed layer sizes, base vs PR head
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          measure() {
            local rev="$1" out=".out-$1"
            sudo rm -rf "$out"
            just bst --config /src/ci/buildstream.conf --network-retries 5 build oci/ghostscript-printer-app.bst
            just bst artifact checkout oci/ghostscript-printer-app.bst --directory "/src/$out"
            sudo chmod -R a+rX "$out"
            manifest="$(jq -r '.manifests[0].digest' "$out/index.json" | cut -d: -f2)"
            layer="$(jq -r '.layers[0].digest' "$out/blobs/sha256/$manifest" | cut -d: -f2)"
            blob="$out/blobs/sha256/$layer"
            tar -tf "$blob" | sed 's|^\./||' | sort > "files-$rev.txt"
            printf '%s raw=%s gzip6=%s zstd3=%s files=%s\n' "$rev" \
              "$(wc -c < "$blob")" \
              "$(gzip -6 -n -c "$blob" | wc -c)" \
              "$(zstd -3 -q -c "$blob" | wc -c)" \
              "$(wc -l < "files-$rev.txt")" | tee -a sizes.txt
          }
          measure head
          git checkout -q "$BASE" -- elements Justfile
          measure base
          git checkout -q HEAD -- elements Justfile
          echo "--- removed from the layer (base -> head), top-level dirs:"
          comm -23 files-base.txt files-head.txt | awk -F/ '{print $1"/"$2"/"$3}' | sort | uniq -c | sort -rn | head -40
          echo "--- added in head:"
          comm -13 files-base.txt files-head.txt
          echo "--- sizes:"
          cat sizes.txt
